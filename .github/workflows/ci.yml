# Backend CI — lint + typecheck + tests + RAG eval + build against a pgvector Postgres.
# No secrets: all values below are throwaway test values for the job only.
# The RAG eval runs fully offline (fake adapters, no network) with quality
# thresholds enforced (--strict): it fails the job on quality regressions.
name: ci

on:
  push:
  pull_request:

# `pull-requests: write` lets the job upsert the RAG-eval summary comment
# with the preinstalled `gh` CLI (no third-party actions, see ADR 0041).
permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: techadvisor
          POSTGRES_PASSWORD: techadvisor
          POSTGRES_DB: techadvisor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U techadvisor -d techadvisor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://techadvisor:techadvisor@localhost:5432/techadvisor?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-at-least-16-chars
      CORS_ORIGINS: http://localhost:3000
      BASE_CURRENCY: USD
      SUPPORTED_CURRENCIES: USD,EUR
      DEFAULT_LOCALE: en
      SUPPORTED_LOCALES: en,es
      DOCS_ENABLED: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx prisma migrate deploy

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - name: RAG eval (offline, strict)
        run: npm run eval -- --offline --strict
      - name: RAG eval summary
        if: always()
        run: |
          latest="$(ls -t eval/results/*.md 2>/dev/null | head -n 1 || true)"
          if [ -z "$latest" ]; then
            echo "No RAG eval report was generated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## RAG evaluation (offline, strict)"
            echo ""
            cat "$latest"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "EVAL_SUMMARY_FILE=$latest" >> "$GITHUB_ENV"
      - name: Comment RAG eval on PR
        if: github.event_name == 'pull_request' && always()
        # Fork PRs get a read-only token, so the comment may fail there;
        # the strict eval gate above still fails the job on regressions.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest="${EVAL_SUMMARY_FILE:-$(ls -t eval/results/*.md 2>/dev/null | head -n 1 || true)}"
          if [ -z "$latest" ]; then
            echo "No RAG eval report to comment."
            exit 0
          fi
          pr_number="${{ github.event.pull_request.number }}"
          marker="<!-- rag-eval-summary -->"
          body="$(printf '%s\n\n%s\n' "$marker" "$(cat "$latest")")"
          existing="$(gh api "repos/${{ github.repository }}/issues/$pr_number/comments" --paginate -q '[.[] | select(.body | contains("<!-- rag-eval-summary -->"))][0].id // empty')"
          if [ -n "$existing" ]; then
            echo "$body" | gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$existing" -F body=@- --jq .html_url
          else
            echo "$body" | gh api -X POST "repos/${{ github.repository }}/issues/$pr_number/comments" -F body=@- --jq .html_url
          fi
      - run: npm run build
