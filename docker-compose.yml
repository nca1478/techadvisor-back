services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: techadvisor
      POSTGRES_PASSWORD: techadvisor
      POSTGRES_DB: techadvisor
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techadvisor -d techadvisor"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  stripe-mock:
    # Mock oficial de la API de Stripe para desarrollo local sin red
    # (ver ADR 0051). Escucha HTTP en 12111 y HTTPS/HTTP2 en 12112.
    # El backend lo usa cuando STRIPE_BASE_URL=http://localhost:12111.
    image: stripe/stripe-mock:latest
    restart: unless-stopped
    ports:
      - "12111:12111"
      - "12112:12112"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:12111/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
  redis-data:
