# Render Blueprint — TechAdvisor backend (API + ingestion worker).
# Postgres (Supabase) y Redis externo se administran fuera de Render:
# sus URLs y secretos se cargan en el Dashboard (sync: false), nunca aquí.
#
# Tier activo: UN solo Web Service free (API + ingesta en el mismo contenedor
# vía `npm run start:free`, ver ADR 0067). La topología de referencia con un
# servicio por proceso (API + Background Worker starter, ADR 0019/0066) sigue
# documentada en git pero no se despliega en free porque Render no ofrece
# workers en ese plan.
#
# IMPORTANTE (ADR 0070): el build NUNCA migra ni siembra. El Dashboard debe usar
# exactamente estos comandos; `npm run db:setup` es solo para desarrollo local
# (los seeds se niegan con NODE_ENV=production y `migrate deploy` en el build
# rompe la idempotencia y provocó el P3018 `type "Role" already exists`).
services:
  - type: web
    name: techadvisor-back
    runtime: node
    plan: free
    region: oregon
    buildCommand: "npm ci && npx prisma generate && npm run build"
    startCommand: "npm run start:free"
    preDeployCommand: "npx prisma migrate deploy"
    healthCheckPath: /api/v1/health
    autoDeploy: true
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: BASE_CURRENCY
        value: USD
      - key: SUPPORTED_CURRENCIES
        value: USD
      - key: DEFAULT_LOCALE
        value: en
      - key: SUPPORTED_LOCALES
        value: en,es
      - key: DOCS_ENABLED
        value: false
      - key: EMBEDDING_PROVIDER
        value: fake
      - key: LLM_PROVIDER
        value: fake
